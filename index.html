<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>pbsakral.tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a08;
    --bg-elev:#151209;
    --card:#1c1810;
    --card-2:#211b10;
    --line:#3a3220;
    --gold:#d4af37;
    --gold-bright:#f2d989;
    --gold-dim:#8a7327;
    --ink:#f4efdf;
    --ink-dim:#b3a98f;
    --ink-faint:#7a725c;
    --prime:#d4af37;
    --core:#c9762f;
    --rising:#3b8fd4;
    --queens:#d43b83;
    --ok:#3fae5c;
    --warn:#d4a53b;
    --danger:#c94747;
    --radius:14px;
    --maxw:920px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(212,175,55,0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 110% 10%, rgba(212,175,55,0.06), transparent 60%);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Anton',sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    line-height:1.05;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  #app{max-width:var(--maxw);margin:0 auto;padding:0 0 64px;min-height:100vh;}

  /* Topbar */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;gap:8px;
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:40;
    background:rgba(11,10,8,0.92);
    backdrop-filter:blur(8px);
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .brand img{height:34px;width:34px;object-fit:contain;border-radius:7px;}
  .brand-text{font-family:'Anton';font-size:15px;letter-spacing:0.02em;color:var(--gold-bright);line-height:1.1;}
  .brand-text small{display:block;font-family:'Inter';font-weight:600;font-size:9px;letter-spacing:0.12em;color:var(--ink-faint);}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .topnav{display:flex;gap:6px;}
  .topnav button{
    background:transparent;border:1px solid var(--line);color:var(--ink-dim);
    padding:7px 11px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .topnav button.active{border-color:var(--gold-dim);color:var(--gold-bright);background:rgba(212,175,55,0.08);}
  .header-logos{display:flex;align-items:center;gap:8px;padding-left:10px;margin-left:2px;border-left:1px solid var(--line);}
  .header-logos img{height:30px;width:30px;object-fit:contain;}

  /* Hero */
  .hero{padding:34px 20px 30px;text-align:center;position:relative;}
  .hero .eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    padding:6px 14px;border-radius:999px;font-size:12px;color:var(--gold-bright);font-weight:600;margin-bottom:18px;}
  .hero .decade-logo{width:150px;height:150px;object-fit:contain;margin:0 auto 6px;display:block;filter:drop-shadow(0 6px 24px rgba(212,175,55,0.25));}
  .hero h1{font-size:clamp(30px,8vw,44px);color:var(--ink);margin:6px 0 2px;}
  .hero h1 span{color:var(--gold-bright);}
  .hero .sub{color:var(--ink-dim);font-size:14px;margin:8px 0 22px;line-height:1.6;}
  .hero .meta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:26px;}
  .meta-pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12.5px;color:var(--ink-dim);}
  .meta-pill b{color:var(--ink);}
  .hero-ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 22px;border-radius:11px;font-weight:700;font-size:14.5px;cursor:pointer;
    border:1px solid transparent;transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-gold{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1508;}
  .btn-gold:hover{filter:brightness(1.06);}
  .btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--gold-dim);}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 14px;font-size:13px;border-radius:9px;}
  .btn-xs{padding:6px 10px;font-size:11.5px;border-radius:8px;}
  .btn-danger{background:rgba(201,71,71,0.15);color:#f3a6a6;border-color:rgba(201,71,71,0.4);}
  .btn-ok{background:rgba(63,174,92,0.15);color:#9fe3b0;border-color:rgba(63,174,92,0.4);}
  .btn-info{background:rgba(59,143,212,0.15);color:#9dc9ef;border-color:rgba(59,143,212,0.4);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* Category cards */
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px;margin-bottom:8px;}
  @media(max-width:480px){.cats{grid-template-columns:1fr 1fr;}}
  .cat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 14px;position:relative;overflow:hidden;cursor:pointer;
  }
  .cat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
  .cat-card .cat-name{font-family:'Anton';font-size:19px;color:var(--accent);letter-spacing:0.02em;}
  .cat-card .cat-level{font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:0.08em;margin-bottom:10px;}
  .cat-card .cat-fee{font-size:15px;font-weight:800;color:var(--ink);}
  .cat-card .cat-fee small{font-size:10.5px;color:var(--ink-faint);font-weight:600;}
  .cat-card .cat-quota{margin-top:10px;font-size:11.5px;color:var(--ink-dim);}
  .quota-bar{height:5px;border-radius:4px;background:var(--line);margin-top:5px;overflow:hidden;}
  .quota-bar-fill{height:100%;background:var(--accent);}

  /* Sections */
  .section{padding:26px 18px;}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-faint);font-weight:700;margin-bottom:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .card + .card{margin-top:12px;}

  /* Forms */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-dim);margin-bottom:6px;}
  .field .hint{font-size:11px;color:var(--ink-faint);margin-top:5px;}
  .field input[type=text],.field input[type=number],.field input[type=tel],.field select,.field textarea{
    width:100%;background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;
    padding:12px 12px;color:var(--ink);font-size:14.5px;font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-dim);}
  .field textarea{resize:vertical;min-height:64px;}
  .radio-cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .radio-cat{border:1.5px solid var(--line);background:var(--bg-elev);border-radius:10px;padding:10px;cursor:pointer;text-align:center;}
  .radio-cat.selected{border-color:var(--accent2);background:rgba(212,175,55,0.06);}
  .radio-cat .rc-name{font-family:'Anton';font-size:14px;}
  .radio-cat .rc-fee{font-size:10.5px;color:var(--ink-faint);margin-top:2px;}
  .radio-cat.full{opacity:0.4;cursor:not-allowed;}
  .file-drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--ink-faint);font-size:13px;cursor:pointer;background:var(--bg-elev);}
  .file-drop img{max-width:100%;max-height:160px;border-radius:8px;margin-top:8px;}

  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px;}
  .seg button{flex:1;background:var(--bg-elev);border:none;color:var(--ink-dim);padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .seg button.active{background:var(--gold-dim);color:#1a1508;}
  .photo-upload{display:flex;gap:10px;}
  .photo-slot{flex:1;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:10px;background:var(--bg-elev);
    display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--ink-faint);font-size:11px;text-align:center;padding:6px;position:relative;}
  .photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  .rules-panel{background:var(--bg-elev);border:1px solid var(--gold-dim);border-radius:10px;padding:14px;margin-top:2px;margin-bottom:14px;}
  .rules-panel h4{margin:0 0 6px;font-size:13px;color:var(--gold-bright);}
  .rules-panel p{margin:0 0 6px;font-size:11.5px;color:var(--ink-faint);}
  .rules-panel ul{margin:6px 0 0;padding-left:18px;font-size:12px;color:var(--ink-dim);line-height:1.6;}
  .checkbox-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;}
  .checkbox-row input{margin-top:3px;width:16px;height:16px;flex-shrink:0;accent-color:var(--gold);}
  .checkbox-row label{font-size:12.5px;color:var(--ink-dim);line-height:1.5;}

  /* Badges */
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:0.02em;white-space:nowrap;}
  .b-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .b-wait{background:rgba(212,165,59,0.15);color:#eecf8a;} .b-wait .b-dot{background:var(--warn);}
  .b-reject{background:rgba(201,71,71,0.15);color:#f3a6a6;} .b-reject .b-dot{background:var(--danger);}
  .b-ok{background:rgba(63,174,92,0.15);color:#9fe3b0;} .b-ok .b-dot{background:var(--ok);}
  .b-info{background:rgba(59,143,212,0.15);color:#9dc9ef;} .b-info .b-dot{background:var(--rising);}
  .b-list{background:rgba(180,180,180,0.1);color:var(--ink-dim);} .b-list .b-dot{background:var(--ink-faint);}

  /* Lists */
  .reg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;margin-bottom:10px;}
  .reg-row:hover{border-color:var(--gold-dim);}
  .reg-row .rr-left .rr-no{font-size:11px;color:var(--ink-faint);font-weight:700;letter-spacing:0.04em;}
  .reg-row .rr-left .rr-name{font-weight:700;font-size:14.5px;margin-top:2px;}
  .reg-row .rr-left .rr-sub{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:13.5px;}

  .kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-dim);min-width:0;}
  .kv .v{font-weight:700;text-align:right;flex-shrink:0;}
  .rule-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-dim);line-height:1.6;}
  .rule-item:last-child{border-bottom:none;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .stat .stat-label{font-size:11px;color:var(--ink-faint);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
  .stat .stat-value{font-family:'Anton';font-size:26px;margin-top:4px;color:var(--gold-bright);}
  .stat .stat-value.small{font-size:19px;font-family:'Inter';font-weight:800;color:var(--ink);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
  @media(min-width:640px){.modal-overlay{align-items:center;}}
  .modal{background:var(--bg-elev);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto;}
  @media(min-width:640px){.modal{border-radius:16px;}}
  .modal h3{font-family:'Inter';font-size:16px;font-weight:800;margin:0 0 6px;}
  .modal p{font-size:13.5px;color:var(--ink-dim);line-height:1.5;margin:0 0 16px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn{flex:1;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold-bright);color:#1a1508;
    padding:12px 20px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.4);
    max-width:90%;text-align:center;}

  .pin-wrap{max-width:320px;margin:60px auto;padding:0 20px;text-align:center;}
  .pin-wrap .badge-shield{width:76px;height:76px;object-fit:contain;margin:0 auto 16px;}
  .logo-strip{display:flex;justify-content:center;align-items:center;gap:20px;padding:20px 18px 4px;opacity:0.9;}
  .logo-strip img{height:44px;width:44px;object-fit:contain;border-radius:8px;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;}
  .tabs button{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--ink-dim);
    padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .tabs button.active{background:var(--card-2);border-color:var(--gold-dim);color:var(--gold-bright);}

  .search-box{position:relative;margin-bottom:14px;}
  .search-box input{width:100%;background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font-size:14px;}

  .footer-note{text-align:center;color:var(--ink-faint);font-size:11.5px;padding:24px 20px 0;line-height:1.7;}
  .link-btn{background:none;border:none;color:var(--gold-bright);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;}
  .back-row{display:flex;align-items:center;gap:8px;padding:14px 18px 0;}
  .back-row button{background:none;border:none;color:var(--ink-dim);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;}

  .flag{background:rgba(201,71,71,0.12);border:1px solid rgba(201,71,71,0.35);color:#f3a6a6;padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;}
  .flag.ok{background:rgba(63,174,92,0.12);border-color:rgba(63,174,92,0.35);color:#9fe3b0;}
  .flag.info{background:rgba(59,143,212,0.12);border-color:rgba(59,143,212,0.35);color:#9dc9ef;}
  .flag.warn{background:rgba(212,165,59,0.12);border-color:rgba(212,165,59,0.35);color:#eecf8a;}

  .photo-pair{display:flex;gap:10px;margin-bottom:10px;}
  .photo-pair .pf{flex:1;text-align:center;}
  .photo-pair img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;border:1px solid var(--line);}
  .photo-pair .pf-name{font-size:11.5px;color:var(--ink-dim);margin-top:4px;font-weight:600;}

  .notif-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;gap:8px;}
  .notif-row:last-child{border-bottom:none;}
  .notif-msg{color:var(--ink-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .notif-meta{font-size:10.5px;color:var(--ink-faint);margin-top:1px;}

  code.mono{font-family:ui-monospace,monospace;background:var(--bg-elev);padding:2px 6px;border-radius:5px;font-size:12.5px;}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;}
  .switch{position:relative;width:42px;height:24px;background:var(--line);border-radius:999px;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--gold-dim);}
  .switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--ink);border-radius:50%;transition:transform .15s ease;}
  .switch.on .knob{transform:translateX(18px);background:var(--gold-bright);}

  .drawing-slot-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .drawing-slot-row:last-child{border-bottom:none;}
  .drawing-slot-no{width:30px;flex-shrink:0;font-family:'Anton';font-size:13px;color:var(--ink-faint);}
  .drawing-slot-row select{flex:1;background:var(--bg-elev);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);font-size:13px;}
  .round-block{margin-bottom:16px;}
  .round-title{font-size:12px;font-weight:800;color:var(--gold-bright);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
  .match-row{background:var(--bg-elev);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .match-row .m-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--ink-faint);margin-bottom:6px;}
  .match-row .m-side{font-size:13px;font-weight:700;padding:3px 0;}
  .match-row .m-vs{font-size:10px;color:var(--ink-faint);text-align:center;padding:1px 0;}
  .sched-scroll{overflow-x:auto;}
  .sched-table{border-collapse:collapse;width:100%;min-width:520px;}
  .sched-table th{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.04em;padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;}
  .sched-table td{border:1px solid var(--line);padding:0;text-align:center;vertical-align:middle;}
  .sched-time{font-size:11px;color:var(--ink-faint);padding:6px 4px;white-space:nowrap;}
  .sched-cell{min-width:88px;height:44px;font-size:10px;font-weight:700;cursor:pointer;padding:3px;line-height:1.25;}
  .sched-cell.empty{color:var(--ink-faint);}
  .sched-cell.filled{background:rgba(212,175,55,0.10);color:var(--gold-bright);}
  .sched-cell:hover{background:rgba(212,175,55,0.18);}
</style>
</head>
<body>
<div id="app"></div>

  const d = new Date(iso);

function normalizeWhatsapp(raw){
  let d = String(raw||"").replace(/[^0-9]/g,"");
  if(d.startsWith("0")) d = "62" + d.slice(1);
  else if(d.startsWith("620")) d = "62" + d.slice(3);
  else if(!d.startsWith("62")) d = "62" + d;
  return "+" + d;

function regSummary(id){ return id ? INDEX.find(x=>x.id===id) : null; }
function participantLabel(id){
  const s = regSummary(id);
  return s ? (s.player1+" / "+s.player2) : "\u2014 (kosong)";
}
function registeredPoolFor(catCode){
  return INDEX.filter(r=>r.category===catCode && r.status==="REGISTERED");
}
function usedSlotParticipants(catCode, excludeIndex){
  const slots = DRAWING[catCode].slots;
  const used = new Set();
  slots.forEach((pid,idx)=>{ if(pid && idx!==excludeIndex) used.add(pid); });
  return used;
}
function generateBracketForCategory(catCode){
  const cat = catByCode(catCode);
  const slots = DRAWING[catCode].slots;
  const roundNames = roundNamesFor(cat.quota);
  const flat = [];
  let prevRound = [];
  for(let i=0;i<slots.length;i+=2){
    const m = { id:uid(), category:catCode, round:roundNames[0], roundIndex:0, matchNo:(i/2)+1,
      sideA:{type:"participant", participantId: slots[i]||null},
      sideB:{type:"participant", participantId: slots[i+1]||null} };
    flat.push(m); prevRound.push(m);
  }
  for(let r=1;r<roundNames.length;r++){
    const curRound = [];
    for(let i=0;i<prevRound.length;i+=2){
      const m = { id:uid(), category:catCode, round:roundNames[r], roundIndex:r, matchNo:(i/2)+1,
        sideA:{type:"winnerOf", matchId: prevRound[i].id},
        sideB:{type:"winnerOf", matchId: prevRound[i+1].id} };
      flat.push(m); curRound.push(m);
    }
    prevRound = curRound;
  }
  MATCHES[catCode] = flat;
}
function matchById(catCode, id){ return (MATCHES[catCode]||[]).find(m=>m.id===id); }
function matchSideLabel(catCode, side){
  if(side.type==="participant"){
    return side.participantId ? participantLabel(side.participantId) : "\u2014 (kosong)";
  }
  const ref = matchById(catCode, side.matchId);
  if(!ref) return "TBD";
  return "Pemenang " + ROUND_LABELS[ref.round] + " #" + ref.matchNo;
}
function scheduleFor(matchId){ return SCHEDULE.find(s=>s.matchId===matchId); }
function scheduleOccupant(day, timeIndex, court){ return SCHEDULE.find(s=>s.day===day && s.timeIndex===timeIndex && s.court===court); }
function participantSchedulesOnDay(participantId, day, excludeScheduleId){
  const out = [];
  SCHEDULE.forEach(s=>{
    if(s.day!==day) return;
    if(excludeScheduleId && s.id===excludeScheduleId) return;
    const cat = s.category;
    const m = matchById(cat, s.matchId);
    if(!m) return;
    const pids = [m.sideA.type==="participant"?m.sideA.participantId:null, m.sideB.type==="participant"?m.sideB.participantId:null];
    if(pids.includes(participantId)) out.push(s.timeIndex);
  });
  return out;
}

/* ============ NOTIFICATIONS (WhatsApp — manual-send model) ============ */
function buildMessage(type, reg, extra){
  extra = extra || {};
  const pairName = reg.player1 + " / " + reg.player2;
  const cat = catByCode(reg.category);
  const statusLink = statusLinkFor(reg.regNo);
  switch(type){
    case "REGISTRATION_SUBMITTED":
      return `PB SAKRAL TOURNAMENT 2026\nPendaftaran ${reg.regNo} atas nama ${pairName} telah kami terima. Status saat ini: Menunggu Validasi Panitia.\nCek status: ${statusLink}`;
    case "REGISTRATION_ACCEPTED":
      return `Pendaftaran Anda diterima.\nKategori: ${cat.name}\nTotal pembayaran: ${rupiah(reg.payment.amountDue)}\nSilakan lihat instruksi pembayaran melalui: ${statusLink}`;
    case "REGISTRATION_REJECTED":
      return `Mohon maaf, pendaftaran ${reg.regNo} atas nama ${pairName} tidak dapat kami proses lebih lanjut.` + (reg.adminNote? ` Catatan panitia: ${reg.adminNote}` : "");
    case "CATEGORY_CHANGE_REQUESTED":
      const newCat = catByCode(reg.pendingCategory);
      return `Panitia mengusulkan perubahan kategori untuk pendaftaran ${reg.regNo} menjadi ${newCat.name}. Silakan konfirmasi melalui: ${statusLink}`;
    case "PAYMENT_PROOF_SUBMITTED":
      return `Bukti pembayaran untuk ${reg.regNo} telah kami terima dan sedang diverifikasi panitia.`;
    case "PAYMENT_VERIFIED":
      return `Pembayaran berhasil diverifikasi.\n${pairName} resmi TERDAFTAR pada kategori ${cat.name}.\nNomor registrasi: ${reg.regNo}.`;
    case "DATA_REVISION_REQUESTED":
      return `Panitia memerlukan kelengkapan data tambahan untuk pendaftaran ${reg.regNo}: ${extra.note||reg.adminNote||"-"}\nSilakan lengkapi melalui: ${statusLink}`;
    default:
      return `PB SAKRAL TOURNAMENT 2026 — Update untuk pendaftaran ${reg.regNo}.`;
  }
}
function pushNotification(reg, type, extra){
  if(!META.settings.whatsappEnabled) return; // per addendum: skip record if integration disabled
  reg.notifications = reg.notifications || [];
  reg.notifications.unshift({
    id: uid(), type, message: buildMessage(type, reg, extra),
    status: "QUEUED", createdAt: nowIso(), sentAt: "", errorMessage: "", providerMessageId: ""
  });
  if(reg.notifications.length>20) reg.notifications = reg.notifications.slice(0,20);
}
function openWaLink(reg, notif){
  const number = (reg.whatsappNumberNormalized||"").replace("+","");
  if(!number){ showToast("Nomor WhatsApp tidak valid."); return; }
  const url = "https://wa.me/"+number+"?text="+encodeURIComponent(notif.message);
  window.open(url, "_blank");

function showToast(msg, ms=2600){
  clearTimeout(toastTimer);
  let e = document.getElementById("toast");
  if(!e){ e = document.createElement("div"); e.id="toast"; e.className="toast"; document.body.appendChild(e); }
  e.textContent = msg; e.style.display="block";
  toastTimer = setTimeout(()=>{ e.style.display="none"; }, ms);
}
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.startsWith("on") && typeof attrs[k]==="function") e.addEventListener(k.slice(2), attrs[k]);
    else if(k==="style") e.setAttribute("style", attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c==="string" || typeof c==="number") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

async function resizeImageFile(file, maxW){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageFile(file, 480);
      regFormState[key] = dataUrl;
      render();
    }catch(err){ showToast("Gagal memproses foto."); }
  });
  slot.addEventListener("click", ()=> input.click());

function videoField(){
  const f = el("div",{class:"field"});
  f.appendChild(el("label",{},"Video Verifikasi (\u00b12 menit)"));
  const seg = el("div",{class:"seg"});
  const btnLink = el("button",{class: regFormState.videoType==="link"?"active":"", type:"button", onclick:()=>{ regFormState.videoType="link"; render(); }},"Link Video");
  const btnFile = el("button",{class: regFormState.videoType==="file"?"active":"", type:"button", onclick:()=>{ regFormState.videoType="file"; render(); }},"Upload File");
  seg.appendChild(btnLink); seg.appendChild(btnFile);
  f.appendChild(seg);
  if(regFormState.videoType==="link"){
    const input = el("input",{type:"text", placeholder:"Link Google Drive / YouTube / dll", value: regFormState.videoLink||""});
    input.addEventListener("input",(e)=>{ regFormState.videoLink = e.target.value; });
    f.appendChild(input);
    f.appendChild(el("div",{class:"hint"},"Disarankan menggunakan link agar tidak membebani penyimpanan."));
  } else {
    const drop = el("div",{class:"file-drop"}, regFormState.videoFileData? "Video terpilih \u2713 (tap untuk ganti)" : "Tap untuk pilih file video (maks 2MB)");
    const input = el("input",{type:"file", accept:"video/*", style:"display:none;"});
    input.addEventListener("change",(e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(file.size > 2*1024*1024){ showToast("File video maksimal 2MB. Gunakan link jika lebih besar."); return; }
      const reader = new FileReader();
      reader.onload = ()=>{ regFormState.videoFileData = reader.result; render(); };
      reader.readAsDataURL(file);
    });
    drop.addEventListener("click",()=>input.click());
    f.appendChild(drop);
    f.appendChild(input);
  }
  return f;
}

async function submitRegistration(){
  const s = regFormState;
  const errEl = document.getElementById("reg-error");
  errEl.innerHTML = "";
  const missing = [];
  if(!s.category) missing.push("Kategori");
  if(!s.player1) missing.push("Nama Pemain 1");
  if(!s.player1Photo) missing.push("Foto Pemain 1");
  if(!s.player2) missing.push("Nama Pemain 2");
  if(!s.player2Photo) missing.push("Foto Pemain 2");
  if(!s.club) missing.push("Nama PB/Klub");
  if(!s.whatsapp) missing.push("Nomor WhatsApp");
  if(!s.domicile) missing.push("Domisili");
  if(s.videoType==="link" && !s.videoLink) missing.push("Link Video Verifikasi");
  if(s.videoType==="file" && !s.videoFileData) missing.push("File Video Verifikasi");
  if(!s.rulesAccepted) missing.push("Persetujuan Pernyataan Data & Level Pemain");
  if(missing.length){
    errEl.appendChild(el("div",{class:"flag"},"Lengkapi dulu: " + missing.join(", ")));
    return;
  }
  const cat = catByCode(s.category);
  const regNo = nextRegNo(cat);
  const nowT = nowIso();
  const reg = {
    id: uid(),
    regNo,
    category: s.category,
    pendingCategory: null,
    player1: s.player1.trim(),
    player2: s.player2.trim(),
    player1PhotoUrl: s.player1Photo,
    player2PhotoUrl: s.player2Photo,
    club: s.club.trim(),
    whatsapp: s.whatsapp.trim(),
    whatsappNumberNormalized: normalizeWhatsapp(s.whatsapp),
    whatsappOptIn: !!s.whatsappOptIn,
    whatsappOptInAt: s.whatsappOptIn ? nowT : "",
    domicile: s.domicile.trim(),
    note: (s.note||"").trim(),
    verificationVideo: { type: s.videoType, value: s.videoType==="link" ? s.videoLink.trim() : s.videoFileData },
    rulesAccepted: true,
    rulesAcceptedAt: nowT,
    categoryRulesVersion: CATEGORY_RULES_VERSION,
    status: "WAITING_VALIDATION",
    adminNote: "",
    createdAt: nowT,
    updatedAt: nowT,
    payment: { amountDue: cat.fee + DEPOSIT_FEE, amountPaid: 0, senderName:"", proofDataUrl:"", status:"UNPAID", verifiedBy:"", verifiedAt:"" },
    participant: null,
    deposit: null,
    notifications: [],
  };
  pushNotification(reg, "REGISTRATION_SUBMITTED");
  const okMeta = await saveMeta();
  const okReg = await persistReg(reg);
  if(!okMeta || !okReg) return;
  resetRegForm();
  nav("success",{regNo: reg.regNo});
}

let listFilterStatus = "ALL";
let listFilterCategory = "ALL";
let listSearch = "";
function viewAdminList(){
  const wrap = el("div",{});
  wrap.appendChild(topbar("admin"));
  const sec = el("div",{class:"section"});
  sec.appendChild(adminTabs("admin-list"));
  sec.appendChild(el("div",{class:"section-title"},"Daftar Pendaftar"));

  const searchBox = el("div",{class:"search-box"});
  const input = el("input",{placeholder:"Cari nomor, nama, klub, whatsapp...", value:listSearch});
  input.addEventListener("input",(e)=>{ listSearch=e.target.value; renderListResults(); });
  searchBox.appendChild(input);
  sec.appendChild(searchBox);

  const catTabs = el("div",{class:"tabs"});
  ["ALL",...META.categories.map(c=>c.code)].forEach(code=>{
    catTabs.appendChild(el("button",{class: listFilterCategory===code?"active":"", onclick:()=>{ listFilterCategory=code; render(); }},
      code==="ALL"?"Semua Kategori":catByCode(code).name));
  });
  sec.appendChild(catTabs);

  const statusTabs = el("div",{class:"tabs"});
  const statuses = ["ALL","WAITING_VALIDATION","DATA_REVISION_REQUESTED","WAITING_CATEGORY_CONFIRMATION","WAITING_PAYMENT","WAITING_VERIFICATION","REGISTERED","WAITING_LIST","REJECTED"];
  const statusLabels = {ALL:"Semua Status",WAITING_VALIDATION:"Validasi",DATA_REVISION_REQUESTED:"Lengkapi Data",WAITING_CATEGORY_CONFIRMATION:"Konfirmasi Kategori",WAITING_PAYMENT:"Menunggu Bayar",WAITING_VERIFICATION:"Verifikasi",REGISTERED:"Terdaftar",WAITING_LIST:"Waiting List",REJECTED:"Ditolak"};
  statuses.forEach(st=>{
    statusTabs.appendChild(el("button",{class: listFilterStatus===st?"active":"", onclick:()=>{ listFilterStatus=st; render(); }}, statusLabels[st]));
  });
  sec.appendChild(statusTabs);

  const resultsWrap = el("div",{id:"list-results"});
  sec.appendChild(resultsWrap);
  wrap.appendChild(sec);
  setTimeout(renderListResults, 0);
  return wrap;
}
function renderListResults(){
  const resultsWrap = document.getElementById("list-results");
  if(!resultsWrap) return;
  resultsWrap.innerHTML = "";
  let items = INDEX.slice().sort((a,b)=> b.createdAt.localeCompare(a.createdAt));
  if(listFilterCategory!=="ALL") items = items.filter(r=>r.category===listFilterCategory);
  if(listFilterStatus!=="ALL") items = items.filter(r=>r.status===listFilterStatus);
  if(listSearch.trim()){
    const q = listSearch.trim().toLowerCase();
    items = items.filter(r => [r.regNo,r.player1,r.player2,r.club,r.whatsapp].join(" ").toLowerCase().includes(q));
  }
  if(items.length===0){
    resultsWrap.appendChild(el("div",{class:"empty"},"Tidak ada pendaftar yang cocok."));
    return;
  }
  items.forEach(r=>{
    const cat = catByCode(r.category);
    const row = el("div",{class:"reg-row", onclick:()=>nav("admin-detail",{id:r.id})});
    const left = el("div",{class:"rr-left"});
    left.appendChild(el("div",{class:"rr-no"},r.regNo));
    left.appendChild(el("div",{class:"rr-name"},r.player1+" / "+r.player2));
    left.appendChild(el("div",{class:"rr-sub"},[cat.name+" \u00b7 "+r.club]));
    row.appendChild(left);
    row.appendChild(statusBadge(r.status));
    resultsWrap.appendChild(row);
  });
}

function renderCategoryMoveModal(reg){
  const overlay = el("div",{class:"modal-overlay", onclick:(e)=>{ if(e.target===overlay){ categoryMoveModal=false; render(); } }});

  modal.appendChild(el("h3",{},"Pindahkan Kategori"));
  modal.appendChild(el("p",{},"Peserta akan diminta konfirmasi sebelum melanjutkan ke pembayaran."));
  let selected = META.categories.find(c=>c.code!==reg.category).code;
  const sel = el("select",{style:"width:100%;background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--ink);margin-bottom:14px;"});
  META.categories.forEach(c=>{
    if(c.code===reg.category) return;
    sel.appendChild(el("option",{value:c.code}, c.name));
  });
  sel.addEventListener("change",(e)=>{ selected = e.target.value; });
  modal.appendChild(sel);
  const actions = el("div",{class:"modal-actions"});
  actions.appendChild(el("button",{class:"btn btn-outline", onclick:()=>{ categoryMoveModal=false; render(); }},"Batal"));
  actions.appendChild(el("button",{class:"btn btn-gold", onclick: async ()=>{
    reg.pendingCategory = selected;
    reg.status = "WAITING_CATEGORY_CONFIRMATION";
    pushNotification(reg, "CATEGORY_CHANGE_REQUESTED");
    categoryMoveModal=false;
    await persistReg(reg);
    showToast("Permintaan pindah kategori dikirim ke peserta.");
    render();
  }},"Kirim Usulan"));
  modal.appendChild(actions);
  overlay.appendChild(modal);
  return overlay;
}
function renderRevisionRequestModal(reg){

  const modal = el("div",{class:"modal"});
  modal.appendChild(el("h3",{},"Minta Data Tambahan"));

function renderManualWaModal(reg){
  const overlay = el("div",{class:"modal-overlay", onclick:(e)=>{ if(e.target===overlay){ manualWaModal=false; render(); } }});
  const modal = el("div",{class:"modal"});
  modal.appendChild(el("h3",{},"Kirim WhatsApp Manual"));
  modal.appendChild(el("p",{},"Pilih template pesan untuk dikirim ke nomor peserta."));
  const types = ["REGISTRATION_SUBMITTED","REGISTRATION_ACCEPTED","REGISTRATION_REJECTED","CATEGORY_CHANGE_REQUESTED","PAYMENT_PROOF_SUBMITTED","PAYMENT_VERIFIED","DATA_REVISION_REQUESTED"];
  const labels = {REGISTRATION_SUBMITTED:"Registrasi Diterima Sistem",REGISTRATION_ACCEPTED:"Pendaftaran Diterima Panitia",REGISTRATION_REJECTED:"Pendaftaran Ditolak",CATEGORY_CHANGE_REQUESTED:"Usulan Pindah Kategori",PAYMENT_PROOF_SUBMITTED:"Bukti Bayar Diterima",PAYMENT_VERIFIED:"Pembayaran Terverifikasi",DATA_REVISION_REQUESTED:"Minta Data Tambahan"};
  const sel = el("select",{style:"width:100%;background:var(--bg-elev);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--ink);margin-bottom:14px;"});
  types.forEach(t=>{
    if(t==="CATEGORY_CHANGE_REQUESTED" && !reg.pendingCategory) return;
    sel.appendChild(el("option",{value:t}, labels[t]));
  });
  modal.appendChild(sel);
  const actions = el("div",{class:"modal-actions"});
  actions.appendChild(el("button",{class:"btn btn-outline", onclick:()=>{ manualWaModal=false; render(); }},"Batal"));
  actions.appendChild(el("button",{class:"btn btn-gold", onclick: async ()=>{
    const type = sel.value;
    reg.notifications = reg.notifications || [];
    const notif = { id: uid(), type, message: buildMessage(type, reg, {}), status:"QUEUED", createdAt: nowIso(), sentAt:"", errorMessage:"", providerMessageId:"" };
    reg.notifications.unshift(notif);
    manualWaModal=false;
    await persistReg(reg);
    openWaLink(reg, notif);
    render();
  }},"Buka WhatsApp"));
  modal.appendChild(actions);
  overlay.appendChild(modal);
  return overlay;
}

    ? el("span",{class:"badge b-ok"},[el("span",{class:"b-dot"}),"Terkunci"])
    : el("span",{class:"badge b-list"},[el("span",{class:"b-dot"}),"Draft"]));
  headCard.appendChild(headRow);
  if(drawing.locked){
    headCard.appendChild(el("button",{class:"btn btn-outline btn-block", style:"margin-top:12px;", onclick:()=>openConfirm({
      title:"Buka Kunci Drawing?",
      body:"Membuka kunci akan menghapus bracket dan jadwal kategori ini yang sudah dibuat, sehingga perlu di-generate ulang setelah drawing diubah dan dikunci lagi.",
      confirmLabel:"Unlock", danger:true,
      onConfirm: async ()=>{
        drawing.locked = false;
        drawing.auditLog.push({action:"UNLOCK", at: nowIso()});
        MATCHES[cat.code] = [];
        SCHEDULE = SCHEDULE.filter(s=>s.category!==cat.code);
        await saveDrawing(); await saveMatches(); await saveSchedule();
        showToast("Drawing dibuka kembali.");
        render();
      }
    })},"Unlock Drawing"));
  } else {
    const row = el("div",{style:"display:flex;gap:8px;margin-top:12px;"});
    row.appendChild(el("button",{class:"btn btn-outline btn-sm", style:"flex:1;", onclick: async ()=>{
      const ok = await saveDrawing();
      if(ok) showToast("Draft drawing disimpan.");
    }},"Simpan Draft"));
    row.appendChild(el("button",{class:"btn btn-gold btn-sm", style:"flex:1;", disabled: filled===0, onclick:()=>openConfirm({
      title:"Kunci Drawing "+cat.name+"?",
      body:"Setelah dikunci, bracket akan dibuat otomatis dari slot saat ini. Perubahan berikutnya memerlukan Unlock.",
      confirmLabel:"Lock Drawing",
      onConfirm: async ()=>{
        drawing.locked = true;
        drawing.auditLog.push({action:"LOCK", at: nowIso()});
        generateBracketForCategory(cat.code);
        await saveDrawing(); await saveMatches();
        showToast("Drawing dikunci & bracket dibuat.");
        render();
      }
    })},"Lock Drawing"));
    headCard.appendChild(row);
  }
  sec.appendChild(headCard);

  const slotsCard = el("div",{class:"card"});
  drawing.slots.forEach((pid, idx)=>{
    const row = el("div",{class:"drawing-slot-row"});
    row.appendChild(el("div",{class:"drawing-slot-no"},"#"+(idx+1)));
    if(drawing.locked){
      row.appendChild(el("div",{style:"flex:1;font-size:13px;"}, pid? participantLabel(pid) : "\u2014 (kosong)"));
    } else {
      const used = usedSlotParticipants(cat.code, idx);
      const sel = el("select",{});
      sel.appendChild(el("option",{value:""},"\u2014 (kosong)"));
      pool.forEach(p=>{
        if(used.has(p.id)) return;
        sel.appendChild(el("option",{value:p.id, selected: p.id===pid?"selected":null}, p.regNo+" \u2014 "+p.player1+"/"+p.player2));
      });
      sel.value = pid || "";
      sel.addEventListener("change", (e)=>{ drawing.slots[idx] = e.target.value || null; render(); });
      row.appendChild(sel);
    }
    slotsCard.appendChild(row);
  });
  sec.appendChild(slotsCard);
  wrap.appendChild(sec);
  return wrap;
}

async function generateDraftSchedule(){
  let queue = [];
  META.categories.forEach(cat=>{
    (MATCHES[cat.code]||[]).forEach(m=>{
      if(m.roundIndex!==0) return;
      if(m.sideA.type!=="participant" || m.sideB.type!=="participant") return;
      if(!m.sideA.participantId || !m.sideB.participantId) return;
      if(scheduleFor(m.id)) return;
      queue.push(m);
    });
  });
  const lastSlot = {}; // "day-participantId" -> timeIndex
  SCHEDULE.forEach(s=>{
    const m = matchById(s.category, s.matchId);
    if(!m) return;
    [m.sideA, m.sideB].forEach(side=>{
      if(side.type==="participant" && side.participantId){
        const key = s.day+"-"+side.participantId;
        lastSlot[key] = Math.max(lastSlot[key]===undefined?-99:lastSlot[key], s.timeIndex);
      }
    });
  });
  let scheduledCount = 0;
  outer:
  for(const d of TOURNAMENT_DAYS){
    for(let idx=0; idx<SLOTS_PER_DAY; idx++){
      for(const court of COURTS){
        if(queue.length===0) break outer;
        if(scheduleOccupant(d.day, idx, court)) continue;
        let pickIdx = -1;
        for(let qi=0; qi<queue.length; qi++){
          const m = queue[qi];
          const pidA = m.sideA.participantId, pidB = m.sideB.participantId;
          const lastA = lastSlot[d.day+"-"+pidA], lastB = lastSlot[d.day+"-"+pidB];
          const okA = lastA===undefined || (idx-lastA) > REST_MIN_GAP;
          const okB = lastB===undefined || (idx-lastB) > REST_MIN_GAP;
          if(okA && okB){ pickIdx = qi; break; }
        }
        if(pickIdx===-1) continue;
        const m = queue.splice(pickIdx,1)[0];
        SCHEDULE.push({ id:uid(), matchId:m.id, category:m.category, day:d.day, timeIndex:idx, court });
        lastSlot[d.day+"-"+m.sideA.participantId] = idx;
        lastSlot[d.day+"-"+m.sideB.participantId] = idx;
        scheduledCount++;
      }
    }
  }
  await saveSchedule();
  return scheduledCount;
}

function renderMoveMatchModal(){
  const {category, matchId} = moveMatchTarget;
  const m = matchById(category, matchId);
  const overlay = el("div",{class:"modal-overlay", onclick:(e)=>{ if(e.target===overlay){ moveMatchTarget=null; render(); } }});
  const modal = el("div",{class:"modal"});
  modal.appendChild(el("h3",{},"Atur Jadwal Match"));
  modal.appendChild(el("p",{}, matchSideLabel(category,m.sideA) + " vs " + matchSideLabel(category,m.sideB) + " \u00b7 " + ROUND_LABELS[m.round] + " #" + m.matchNo));
  const existing = scheduleFor(m.id);

  let selDay = existing? existing.day : TOURNAMENT_DAYS[0].day;
  let selTime = existing? existing.timeIndex : 0;
  let selCourt = existing? existing.court : COURTS[0];

  const dayField = el("div",{class:"field"});
  dayField.appendChild(el("label",{},"Hari"));
  const daySel = el("select",{});
  TOURNAMENT_DAYS.forEach(d=> daySel.appendChild(el("option",{value:d.day, selected: d.day===selDay?"selected":null}, d.label)));
  daySel.addEventListener("change",(e)=>{ selDay=Number(e.target.value); });
  dayField.appendChild(daySel);
  modal.appendChild(dayField);

  const timeField = el("div",{class:"field"});
  timeField.appendChild(el("label",{},"Jam"));
  const timeSel = el("select",{});
  for(let i=0;i<SLOTS_PER_DAY;i++){ timeSel.appendChild(el("option",{value:i, selected:i===selTime?"selected":null}, timeLabel(i))); }
  timeSel.addEventListener("change",(e)=>{ selTime=Number(e.target.value); });
  timeField.appendChild(timeSel);
  modal.appendChild(timeField);

  const courtField = el("div",{class:"field"});
  courtField.appendChild(el("label",{},"Court"));
  const courtSel = el("select",{});
  COURTS.forEach(c=> courtSel.appendChild(el("option",{value:c, selected:c===selCourt?"selected":null}, "Court "+c)));
  courtSel.addEventListener("change",(e)=>{ selCourt=Number(e.target.value); });
  courtField.appendChild(courtSel);
  modal.appendChild(courtField);

  const errBox = el("div",{});
  modal.appendChild(errBox);

  const actions = el("div",{class:"modal-actions"});
  if(existing){
    actions.appendChild(el("button",{class:"btn btn-danger", onclick: async ()=>{
      SCHEDULE = SCHEDULE.filter(s=>s.id!==existing.id);
      moveMatchTarget=null;
      await saveSchedule();
      showToast("Match dihapus dari jadwal.");
      render();
    }},"Hapus"));
  } else {
    actions.appendChild(el("button",{class:"btn btn-outline", onclick:()=>{ moveMatchTarget=null; render(); }},"Batal"));
  }
  actions.appendChild(el("button",{class:"btn btn-gold", onclick: async ()=>{
    errBox.innerHTML = "";
    const occ = scheduleOccupant(selDay, selTime, selCourt);
    if(occ && (!existing || occ.id!==existing.id)){
      errBox.appendChild(el("div",{class:"flag"},"Slot ini sudah dipakai match lain."));
      return;
    }
    const pids = [m.sideA.type==="participant"?m.sideA.participantId:null, m.sideB.type==="participant"?m.sideB.participantId:null].filter(Boolean);
    for(const pid of pids){
      const others = participantSchedulesOnDay(pid, selDay, existing? existing.id : null);
      if(others.includes(selTime)){
        errBox.appendChild(el("div",{class:"flag"},"Salah satu peserta sudah dijadwalkan pada jam yang sama."));
        return;
      }
    }
    let restWarning = false;
    for(const pid of pids){
      const others = participantSchedulesOnDay(pid, selDay, existing? existing.id : null);
      if(others.some(t=>Math.abs(t-selTime)<=REST_MIN_GAP && t!==selTime)) restWarning = true;
    }
    if(existing){
      existing.day=selDay; existing.timeIndex=selTime; existing.court=selCourt;
    } else {
      SCHEDULE.push({id:uid(), matchId:m.id, category, day:selDay, timeIndex:selTime, court:selCourt});
    }
    moveMatchTarget = null;
    await saveSchedule();
    showToast(restWarning? "Tersimpan \u2014 perhatikan waktu istirahat peserta cukup pendek." : "Jadwal tersimpan.");
    render();
  }},"Simpan"));
  modal.appendChild(actions);
  overlay.appendChild(modal);
  return overlay;
}

/* ============ CONFIRM MODAL ============ */
function openConfirm(cfg){ confirmModal = cfg; render(); }
function renderConfirmModal(){
  if(!confirmModal) return null;
  const overlay = el("div",{class:"modal-overlay", onclick:(e)=>{ if(e.target===overlay){ confirmModal=null; render(); } }});
  const modal = el("div",{class:"modal"});
  modal.appendChild(el("h3",{},confirmModal.title));
  modal.appendChild(el("p",{},confirmModal.body));
  const actions = el("div",{class:"modal-actions"});
  actions.appendChild(el("button",{class:"btn btn-outline", onclick:()=>{ confirmModal=null; render(); }},"Batal"));
  actions.appendChild(el("button",{class:"btn "+(confirmModal.danger?"btn-danger":"btn-gold"), onclick: async ()=>{
    const fn = confirmModal.onConfirm;
    confirmModal = null;
    await fn();
  }}, confirmModal.confirmLabel));
  modal.appendChild(actions);
  overlay.appendChild(modal);
  return overlay;

/* ============ MAIN RENDER ============ */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(!ready){
    app.appendChild(el("div",{style:"padding:60px;text-align:center;color:var(--ink-dim);"},"Memuat..."));
    return;
  }
  let view;
  switch(route.name){
    case "home": view = viewHome(); break;
    case "register": view = viewRegister(route.params); break;
    case "success": view = viewSuccess(route.params); break;
    case "status": view = viewStatus(route.params); break;
    case "admin-login": view = adminSession? viewAdminDashboard() : viewAdminLogin(); break;
    case "admin-dashboard": view = adminSession? viewAdminDashboard() : viewAdminLogin(); break;
    case "admin-list": view = adminSession? viewAdminList() : viewAdminLogin(); break;
    case "admin-detail": view = adminSession? viewAdminDetail(route.params) : viewAdminLogin(); break;
    case "admin-participants": view = adminSession? viewAdminParticipants() : viewAdminLogin(); break;
    case "admin-drawing": view = adminSession? viewAdminDrawing() : viewAdminLogin(); break;
    case "admin-bracket": view = adminSession? viewAdminBracket() : viewAdminLogin(); break;
    case "admin-schedule": view = adminSession? viewAdminSchedule() : viewAdminLogin(); break;
    case "admin-settings": view = adminSession? viewAdminSettings() : viewAdminLogin(); break;
    default: view = viewHome();
  }
  app.appendChild(view);
  const modal = renderConfirmModal();
  if(modal) app.appendChild(modal);
}

/* ============ INIT ============ */
(async function init(){
  await loadMeta();
  await loadIndex();
  await loadPhase2();
  ready = true;
  const urlParams = new URLSearchParams(location.search);
  const regParam = urlParams.get("reg");
  if(regParam){ route = {name:"status", params:{regNo: regParam}}; }
  render();
})();
